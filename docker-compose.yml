services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
    env_file:
      - .env
    environment:
      # Windows host: inotify events don't cross the bind mount, so watchfiles must poll
      - WATCHFILES_FORCE_POLLING=true
    command: >
      poetry run uvicorn app.main:app
      --host 0.0.0.0 --port 8000
      --reload --reload-dir app
